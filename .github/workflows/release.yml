name: 发布 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  TAG_NAME: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  # ─── Windows：NSIS 安装包 + 便携版 zip ───────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: pnpm install

      - name: 构建 Windows 安装包 (NSIS)
        run: pnpm tauri build --bundles nsis

      - name: 创建 Windows 便携版 zip
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri\tauri.conf.json" | ConvertFrom-Json).version
          $exePath = "src-tauri\target\release\claude-code-launcher.exe"
          $zipName = "Claude-Code-Launcher_${version}-windows-portable.zip"
          Compress-Archive -Path $exePath -DestinationPath $zipName
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Claude Code Launcher ${{ env.TAG_NAME }}
          body: |
            ## 下载说明

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows | `*_x64-setup.exe` | NSIS 安装包（推荐） |
            | Windows | `*-windows-portable.zip` | 便携版，解压即用 |
            | macOS | `*_universal.dmg` | DMG 安装包（Intel + Apple Silicon） |
            | macOS | `*-macos-portable.zip` | 便携版 .app，解压拖入应用程序文件夹 |
            | Linux ARM64 | `*_arm64.deb` | Debian/Ubuntu 安装包 |
            | Linux ARM64 | `*_aarch64.AppImage` | AppImage，chmod +x 后直接运行 |

            > macOS/Windows 未签名版本首次运行需要手动允许。
          draft: true
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.PORTABLE_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── macOS：Universal DMG 安装包 + 便携版 zip ────────────────────────────────
  build-macos:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 安装前端依赖
        run: pnpm install

      - name: 构建 macOS Universal 安装包 (DMG + App)
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg,app

      - name: 创建 macOS 便携版 zip
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Claude Code Launcher.app"
          ZIP_NAME="Claude-Code-Launcher_${VERSION}-macos-portable.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "PORTABLE_ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Claude Code Launcher ${{ env.TAG_NAME }}
          draft: true
          prerelease: false
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            ${{ env.PORTABLE_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Linux ARM64：deb + AppImage ─────────────────────────────────────────────
  build-linux-arm:
    name: Linux ARM64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: 安装前端依赖
        run: pnpm install

      - name: 构建 Linux ARM64 包 (deb + AppImage)
        run: pnpm tauri build --bundles deb,appimage

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Claude Code Launcher ${{ env.TAG_NAME }}
          draft: true
          prerelease: false
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
